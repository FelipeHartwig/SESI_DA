<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamento de Tênis</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>Orçamento de Tênis</h1>

    <label>Nome do cliente</label>
    <input type="text" id="cliente">

    <label>Produto</label>
    <select id="produto">
      <option value="450">Raquete - R$450</option>
      <option value="35">Bolinha de Tênis - R$35</option>
      <option value="25">Overgrip - R$25</option>
    </select>

    <label>Quantidade</label>
    <input type="number" id="quantidade" value="1">

    <button onclick="calcularOrcamento()">
      Calcular orçamento
    </button>

    <div class="resultado" id="resultado">
      O orçamento aparecerá aqui.
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
